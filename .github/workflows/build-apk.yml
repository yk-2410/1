name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Debug APK
        id: locate_apk
        run: |
          echo "Locating built debug APK..."
          FOUND_APK=$(find . -type f -name "*debug*.apk" -path "*/outputs/apk/*" | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*.apk" -path "*/build/*" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No debug APK found after assembleDebug"
            exit 1
          fi

          echo "Found APK at: $FOUND_APK"
          mkdir -p build/outputs/apk/debug
          cp -f "$FOUND_APK" build/outputs/apk/debug/app-debug.apk
          echo "apk_file=build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Notification-Fix-Debug
          path: ${{ steps.locate_apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 30
